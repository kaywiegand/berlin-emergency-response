version: 2

sources:
  - name: bf_open_data
    description: >
      Raw layer written by scripts/ingest.py from Berliner-Feuerwehr/BF-Open-Data (CC BY 4.0).
      All columns are VARCHAR; each table carries _partition, _source_file and _loaded_at.
    schema: main
    tables:
      - name: raw_mission_data
        description: One row per mission, 2018 to present. No mission id, no time of day. Partition = year.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
      - name: raw_daily_mission_data
        description: City-wide daily series (BFw_mission_data_daily.csv), reloaded completely on every run.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
      - name: raw_regional_planning_room
        description: Yearly figures per Planungsraum (8-digit LOR id), 2024 onward. Partition = year.
      - name: raw_regional_district_area
        description: Yearly figures per Bezirksregion (6-digit LOR id), 2024 onward. Partition = year.
      - name: raw_regional_prediction_area
        description: Yearly figures per Prognoseraum (4-digit LOR id), 2024 onward. Partition = year.
      - name: raw_turnout_times
        description: Crew turnout times per fire station. Partition = quarter (e.g. 2025_q1) or 'current' (rolling 30 days).
