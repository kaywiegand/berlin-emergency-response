name: 'berlin_emergency_response'
version: '1.0.0'
config-version: 2

profile: 'berlin_emergency'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  berlin_emergency_response:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  # Hilfsfrist threshold on response_time (seconds) per mission group. Assumption for ems, see docs/PLAN.md.
  # fire: the goal is 14 firefighters in 15 minutes (not a first-vehicle time); technical rescue: no time goal.
  timegoal_seconds:
    ems: 600

seeds:
  berlin_emergency_response:
    seed_districts:
      +column_types:
        district_code: varchar
    seed_dispatch_codes:
      +column_types:
        dispatchcode: varchar
    seed_dispatch_code_map:
      +column_types:
        dispatchcode: varchar
        dispatch_level: varchar
    seed_stations:
      +column_types:
        station_id: varchar
        volunteer_id: varchar
        postcode: varchar
