[project]
name = "berlin-emergency-response"
version = "0.1.0"
description = "dbt Analytics Engineering Certification project based on Berlin Fire Department Open Data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.8.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "ipykernel>=7.4.0",
    "plotly>=7.1.0",
    "streamlit>=1.65.0",
    "wgnd",
    "shapely>=2.2.0",
    "pyarrow>=25.0.1",
]

[tool.uv.sources]
wgnd = { git = "https://github.com/kaywiegand/wgnd-toolkit" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/berlin_emergency_response"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
]
